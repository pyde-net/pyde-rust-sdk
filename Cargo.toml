[package]
name = "pyde-rust-sdk"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
description = "Rust SDK for the Pyde blockchain — account generation, signing, RPC client, contract interaction"
repository = "https://github.com/pyde-net/pyde-rust-sdk"

[dependencies]
# ── Crypto (sibling path-dep per pyde-net convention) ─────────────────
# FALCON-512 signatures, Poseidon2 hashing, Blake3, Kyber-768.
pyde-crypto = { path = "../pyde-crypto" }

# ── Async runtime + transport ────────────────────────────────────────
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
async-trait = "0.1"

# ── Serialization ────────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1", features = ["derive"] }  # canonical Pyde wire encoding — matches engine byte-for-byte
hex = "0.4"

# ── Encrypted keystore (T8) ──────────────────────────────────────────
argon2 = "0.5"        # password-based KDF for at-rest secret-key storage
aes-gcm = "0.10"      # AEAD wrapping the encrypted key material
rand = "0.8"
zeroize = { version = "1", features = ["alloc"] }

# ── WASM ABI parsing (T10) ───────────────────────────────────────────
wasmparser = "0.220"  # walks deployed contract bytecode to find pyde.abi custom section

# ── Big-integer support for u256/i256 contract calldata (T10) ────────
ruint = { version = "1", features = ["serde"] }

# ── Error handling ───────────────────────────────────────────────────
thiserror = "2"

# ── Proc-macro sub-crate ─────────────────────────────────────────────
# pyde_abi! lives in a separate crate because Rust requires
# proc-macros to be in a `proc-macro = true` crate. Re-exported
# via `pub use pyde_sdk_macros::pyde_abi;` from `src/contract/`.
pyde-sdk-macros = { path = "./pyde-sdk-macros" }

[dev-dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[lints.rust]
unsafe_code = "deny"  # SDK is pure Rust — no wasm-bindgen here, no FFI; deny is appropriate
unused_must_use = "deny"

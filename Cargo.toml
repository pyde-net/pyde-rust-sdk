[package]
name = "pyde-rust-sdk"
version = "0.3.0"
license = "Apache-2.0"
edition = "2021"
authors = ["zarah <zarah@pyde.network>"]
# Minimum Supported Rust Version — async fn in traits was stabilised
# in 1.75. The Provider trait depends on it; bumping the MSRV is a
# minor-version SDK change. CI verifies builds against this version.
rust-version = "1.75"
description = "Rust SDK for the Pyde blockchain — account generation, signing, RPC client, contract interaction"
repository = "https://github.com/pyde-net/pyde-rust-sdk"
homepage = "https://pyde.network"
documentation = "https://docs.rs/pyde-rust-sdk"
readme = "README.md"
keywords = ["blockchain", "pyde", "post-quantum", "falcon", "rpc-client"]
categories = ["cryptography", "api-bindings", "asynchronous"]

[dependencies]
# ── Crypto (sibling path-dep per pyde-net convention) ─────────────────
# FALCON-512 signatures, Poseidon2 hashing, Blake3.
# `path` resolves locally during dev; `version` is what cargo
# publishes against once pyde-crypto ships to crates.io. Both forms
# must coexist so `cargo publish` accepts the manifest.
pyde-crypto = { path = "../pyde-crypto", version = "0.1.0-testnet.1" }

# ── Async runtime + transport ────────────────────────────────────────
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"             # validate RPC endpoints up front rather than on first send
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
async-trait = "0.1"

# ── Serialization ────────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1", features = ["derive"] }  # canonical Pyde wire encoding — matches engine byte-for-byte
hex = "0.4"
blake3 = "1"          # event-signature topic hashing per Pyde dual-hash strategy

# ── Encrypted keystore (T8) ──────────────────────────────────────────
argon2 = "0.5"        # password-based KDF for at-rest secret-key storage
aes-gcm = "0.10"      # AEAD wrapping the encrypted key material
rand = "0.8"
zeroize = { version = "1", features = ["alloc"] }
subtle = "2"          # constant-time byte-slice compare for FALCON pubkey eq

# ── WASM ABI parsing (T10) ───────────────────────────────────────────
wasmparser = "0.220"  # walks deployed contract bytecode to find pyde.abi custom section

# ── Big-integer support for u256/i256 contract calldata (T10) ────────
ruint = { version = "1", features = ["serde"] }

# ── Error handling ───────────────────────────────────────────────────
thiserror = "2"

# ── Proc-macro sub-crate ─────────────────────────────────────────────
# pyde_abi! lives in a separate crate because Rust requires
# proc-macros to be in a `proc-macro = true` crate. Re-exported
# via `pub use pyde_sdk_macros::pyde_abi;` from `src/contract/`.
pyde-sdk-macros = { path = "./pyde-sdk-macros", version = "0.1.0" }

[dev-dependencies]
anyhow = "1"
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"      # in-process HTTP mock for provider integration tests
proptest = "1"        # property-based tests over the codec + tx round-trip

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[lints.rust]
unsafe_code = "deny"  # SDK is pure Rust — no wasm-bindgen here, no FFI; deny is appropriate
unused_must_use = "deny"

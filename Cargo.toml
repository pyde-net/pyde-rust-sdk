[package]
name = "pyde-rust-sdk"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
description = "Rust SDK for interacting with the Pyde blockchain"

[dependencies]
# Sibling-repo crates (pyde-net/core)
pyde-crypto = { path = "../core/crates/crypto" }
pyde-tx = { path = "../core/crates/tx" }
pyde-account = { path = "../core/crates/account" }

# Async HTTP + WebSocket
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
ethnum = "1.5.2"

# Encryption
aes-gcm = "0.10"
rand = "0.8"
argon2 = "0.5"
zeroize = { version = "1", features = ["alloc"] }

# Error handling
thiserror = "2"

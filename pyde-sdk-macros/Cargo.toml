[package]
name = "pyde-sdk-macros"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
description = "Proc-macros for pyde-rust-sdk — pyde_abi! contract codegen"
repository = "https://github.com/pyde-net/pyde-rust-sdk"
authors = ["zarah <zarah@pyde.network>"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"  # Blake3(name)[..4] selector per HOST_FN_ABI §3.7.4

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

# Dependabot configuration — automated dependency update PRs.
#
# Two ecosystems tracked:
#   1. cargo — the SDK's Rust deps (tokio, reqwest, blake3, ...)
#   2. github-actions — the action versions in .github/workflows/
#
# All updates land as PRs labelled `dependencies`. Security updates
# are grouped + raised regardless of schedule; non-security updates
# follow the weekly cadence so the SDK doesn't drown in upgrade PRs.

version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Africa/Lagos"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "deps"
      include: scope
    groups:
      # Bundle minor + patch updates so they don't each open a PR.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: "Africa/Lagos"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
      include: scope
